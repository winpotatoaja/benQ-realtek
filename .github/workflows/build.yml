name: Build ALC262 Debug KMOD - OpenWrt 25.12.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT CUSTOM REPOSITORY
      # ============================================================

      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          path: custom

      # ============================================================
      # HOST DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            flex \
            m4 \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            patch \
            zstd

      # ============================================================
      # CLONE EXACT OPENWRT 25.12.5
      # ============================================================

      - name: Clone OpenWrt 25.12.5
        run: |
          git clone \
            --depth 1 \
            --branch v25.12.5 \
            https://git.openwrt.org/openwrt/openwrt.git \
            openwrt

      # ============================================================
      # VERIFY EXACT OPENWRT VERSION
      # ============================================================

      - name: Verify OpenWrt version
        working-directory: openwrt
        run: |
          echo "=========================================="
          echo "OPENWRT VERSION"
          echo "=========================================="

          echo "HEAD:"
          git rev-parse HEAD

          echo
          echo "TAG:"
          git describe --tags --exact-match HEAD || true

          echo
          echo "EXPECTED COMMIT:"
          git rev-list -n 1 v25.12.5

          echo
          echo "VERIFY:"
          test "$(git rev-parse HEAD)" = \
               "$(git rev-list -n 1 v25.12.5)"

          echo
          echo "OpenWrt v25.12.5 verified."

      # ============================================================
      # DOWNLOAD OFFICIAL OPENWRT TOOLCHAIN
      # ============================================================

      - name: Download official OpenWrt 25.12.5 toolchain
        run: |
          TOOLCHAIN_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-toolchain-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          TOOLCHAIN_SHA256="d34d210785e45b3a06460397f3c350d33644fe5660fb7d92d529bf6c47669037"

          wget -q --show-progress \
            "$TOOLCHAIN_URL" \
            -O openwrt-toolchain.tar.zst

          echo
          echo "Checking SHA256..."

          echo "$TOOLCHAIN_SHA256  openwrt-toolchain.tar.zst" \
            | sha256sum -c -

          echo
          echo "Toolchain checksum OK."

      # ============================================================
      # EXTRACT OFFICIAL TOOLCHAIN
      # ============================================================

      - name: Extract official OpenWrt toolchain
        run: |
          rm -rf toolchain
          mkdir -p toolchain

          tar \
            --use-compress-program=unzstd \
            -xf openwrt-toolchain.tar.zst \
            -C toolchain

          echo
          echo "Toolchain GCC candidates:"

          find "$GITHUB_WORKSPACE/toolchain" \
            \( -type f -o -type l \) \
            -name 'x86_64-openwrt-linux-musl-gcc' \
            -print \
            | sort

      # ============================================================
      # LOCATE TOOLCHAIN ROOT
      # ============================================================

      - name: Locate official toolchain root
        id: toolchain
        run: |
          GCC="$(find "$GITHUB_WORKSPACE/toolchain" \
            \( -type f -o -type l \) \
            -name 'x86_64-openwrt-linux-musl-gcc' \
            -print -quit)"

          if [ -z "$GCC" ]; then
            echo "ERROR: x86_64-openwrt-linux-musl-gcc not found"

            echo
            echo "All GCC candidates:"
            find "$GITHUB_WORKSPACE/toolchain" \
              \( -type f -o -type l \) \
              -name '*gcc*' \
              -print \
              | sort

            exit 1
          fi

          echo "GCC:"
          echo "$GCC"

          TOOLCHAIN_ROOT="$(dirname "$(dirname "$GCC")")"

          echo
          echo "Toolchain root:"
          echo "$TOOLCHAIN_ROOT"

          test -x "$GCC"

          echo "toolchain_root=$TOOLCHAIN_ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # VERIFY OFFICIAL TOOLCHAIN
      # ============================================================

      - name: Verify official toolchain
        run: |
          TOOLCHAIN="${{ steps.toolchain.outputs.toolchain_root }}"
          GCC="$TOOLCHAIN/bin/x86_64-openwrt-linux-musl-gcc"

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          echo "$TOOLCHAIN"

          echo
          echo "Compiler:"
          "$GCC" --version | head -1

          echo
          echo "Target:"
          "$GCC" -dumpmachine

          echo
          echo "Sysroot:"
          "$GCC" -print-sysroot

          echo
          echo "Resolved GCC:"
          readlink -f "$GCC"

      # ============================================================
      # CONFIGURE OPENWRT USING EXTERNAL TOOLCHAIN
      # IMPORTANT:
      # DO NOT CREATE .config BEFORE THIS STEP
      # ============================================================

      - name: Configure official external toolchain
        working-directory: openwrt
        run: |
          ./scripts/ext-toolchain.sh \
            --toolchain "${{ steps.toolchain.outputs.toolchain_root }}" \
            --overwrite-config \
            --config x86/64

      # ============================================================
      # ADD REQUIRED OPENWRT PACKAGE CONFIGURATION
      # ============================================================

      - name: Configure OpenWrt sound packages
        working-directory: openwrt
        run: |
          cat >> .config <<'EOF'

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y

          # WAJIB DITAMBAHKAN AGAR TIDAK DI-STRIP OLEH DEFCONFIG
          CONFIG_PACKAGE_kmod-sound-core=m
          CONFIG_PACKAGE_kmod-sound-hda-core=m
          CONFIG_PACKAGE_kmod-sound-hda-codec-realtek=m
          CONFIG_PACKAGE_kmod-sound-hda-codec-generic=m
          CONFIG_PACKAGE_kmod-sound-hda-intel=m
          EOF

          make defconfig

      # ============================================================
      # VERIFY OPENWRT CONFIGURATION
      # ============================================================

      - name: Verify OpenWrt configuration
        working-directory: openwrt
        run: |
          echo "=========================================="
          echo "TARGET"
          echo "=========================================="

          grep -E \
            '^CONFIG_TARGET_x86=|^CONFIG_TARGET_x86_64=' \
            .config

          echo
          echo "=========================================="
          echo "SOUND PACKAGES"
          echo "=========================================="

          grep -E \
            '^CONFIG_PACKAGE_kmod-sound-hda' \
            .config || true

          echo
          echo "=========================================="
          echo "EXTERNAL TOOLCHAIN"
          echo "=========================================="

          grep -E \
            '^CONFIG_EXTERNAL_TOOLCHAIN=|^CONFIG_TOOLCHAIN_ROOT=' \
            .config || true

      # ============================================================
      # PREPARE HOST TOOLS
      # ============================================================

      - name: Prepare OpenWrt host tools
        working-directory: openwrt
        run: |
          make tools/install V=s

      # ============================================================
      # VERIFY HOST TOOLS
      # ============================================================

      - name: Verify host tools
        working-directory: openwrt
        run: |
          echo "=========================================="
          echo "SYSTEM M4"
          echo "=========================================="

          command -v m4
          m4 --version | head -1

          echo
          echo "=========================================="
          echo "OPENWRT HOST M4"
          echo "=========================================="

          test -x staging_dir/host/bin/m4

          ls -l staging_dir/host/bin/m4
          file staging_dir/host/bin/m4

          staging_dir/host/bin/m4 --version | head -1

      # ============================================================
      # PREPARE KERNEL SOURCE
      # ============================================================
      - name: Prepare kernel source
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s

      # ============================================================
      # LOCATE KERNEL SOURCE
      # ============================================================

      - name: Locate kernel source
        id: kernel
        working-directory: openwrt
        run: |
          KERNEL_DIR="$(find build_dir \
            -type d \
            -path '*/linux-x86_64/linux-6.12.94' \
            -print -quit)"

          if [ -z "$KERNEL_DIR" ]; then
            echo "ERROR: kernel source directory not found"

            echo
            echo "Available kernel directories:"
            find build_dir \
              -maxdepth 6 \
              -type d \
              | grep -E 'linux|target-x86_64' || true

            exit 1
          fi

          echo
          echo "Kernel directory:"
          echo "$KERNEL_DIR"

          echo "kernel_dir=$KERNEL_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # VERIFY REALTEK SOURCE
      # ============================================================

      - name: Verify Realtek source
        working-directory: openwrt
        run: |
          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          FILE="$KERNEL_DIR/sound/pci/hda/patch_realtek.c"

          test -f "$FILE"

          echo "=========================================="
          echo "REALTEK SOURCE"
          echo "=========================================="

          echo "$FILE"

          echo
          echo "Relevant ALC262 entries:"

          grep -n \
            -E 'ALC262_FIXUP_BENQ_T31|Benq T31-16|17ff.*058d|0x3050' \
            "$FILE"

      # ============================================================
      # INJECT CUSTOM ALC262 DEBUG CODE
      # ============================================================

      - name: Inject ALC262 debug code
        working-directory: openwrt
        run: |
          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          FILE="$KERNEL_DIR/sound/pci/hda/patch_realtek.c"

          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              source = f.read()

          if "alc262_fixup_benq_t31_debug" in source:
              print("Custom debug code already present.")
              sys.exit(0)

          marker = "static const struct hda_fixup alc262_fixups[] = {"

          code = r'''static void alc262_fixup_benq_t31_debug(struct hda_codec *codec,
                                                  const struct hda_fixup *fix,
                                                  int action)
          {
              if (action == HDA_FIXUP_ACT_PRE_PROBE) {
                  codec_info(codec,
                             "ALC262: [CUSTOM KMOD] BENQ T31 PRE_PROBE\n");

                  snd_hda_codec_write(codec, 0x20, 0,
                                      AC_VERB_SET_COEF_INDEX, 0x07);

                  snd_hda_codec_write(codec, 0x20, 0,
                                      AC_VERB_SET_PROC_COEF, 0x3050);
              }

              if (action == HDA_FIXUP_ACT_PROBE) {
                  codec_info(codec,
                             "ALC262: [CUSTOM KMOD] BENQ T31 PROBE\n");
              }
          }

          '''

          if marker not in source:
              print("ERROR: fixup table marker not found")
              sys.exit(1)

          source = source.replace(marker, code + marker, 1)

          pattern = re.compile(
              r'(\[ALC262_FIXUP_BENQ_T31\]\s*=\s*\{)'
              r'.*?'
              r'(\n\s*\},)',
              re.DOTALL
          )

          match = pattern.search(source)

          if not match:
              print("ERROR: ALC262_FIXUP_BENQ_T31 block not found")
              sys.exit(1)

          replacement = (
              match.group(1)
              + r'''
                  .type = HDA_FIXUP_FUNC,
                  .v.func = alc262_fixup_benq_t31_debug,
              '''
              + match.group(2)
          )

          source = (
              source[:match.start()]
              + replacement
              + source[match.end():]
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(source)

          print("ALC262 custom debug code injected successfully.")
          PY

      # ============================================================
      # VERIFY CUSTOM DEBUG INJECTION
      # ============================================================

      - name: Verify ALC262 debug injection
        working-directory: openwrt
        run: |
          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          FILE="$KERNEL_DIR/sound/pci/hda/patch_realtek.c"

          test -f "$FILE"

          echo "=========================================="
          echo "CUSTOM FUNCTION"
          echo "=========================================="

          grep -n \
            -A25 \
            -B3 \
            'alc262_fixup_benq_t31_debug' \
            "$FILE"

          echo
          echo "=========================================="
          echo "BENQ T31 FIXUP"
          echo "=========================================="

          grep -n \
            -A8 \
            -B2 \
            'ALC262_FIXUP_BENQ_T31' \
            "$FILE"

          echo
          echo "=========================================="
          echo "CUSTOM DEBUG STRINGS"
          echo "=========================================="

          grep -n \
            -E 'CUSTOM KMOD|BENQ T31 PRE_PROBE|BENQ T31 PROBE' \
            "$FILE"

      # ============================================================
      # BUILD KERNEL CORE
      # ============================================================
      - name: Build kernel core
        working-directory: openwrt
        run: |
          echo "=========================================="
          echo "BUILDING KERNEL CORE"
          echo "=========================================="
          make target/linux/compile -j$(nproc) V=s

      # ============================================================
      # FIND REALTEK MODULE DIRECTLY IN KERNEL BUILD TREE
      # ============================================================

      - name: Find custom Realtek module
        working-directory: openwrt
        run: |
          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          echo "=========================================="
          echo "KERNEL MODULE SEARCH"
          echo "=========================================="

          echo "Searching:"
          echo "$KERNEL_DIR"

          echo
          echo "All HDA/Realtek modules:"

          find "$KERNEL_DIR" \
            -type f \
            -name '*.ko' \
            | grep -Ei 'hda|snd|realtek' \
            | sort || true

          echo
          echo "=========================================="
          echo "TARGET MODULE"
          echo "=========================================="

          MODULE="$(find "$KERNEL_DIR" \
            -type f \
            -name 'snd-hda-codec-realtek.ko' \
            -print -quit)"

          if [ -z "$MODULE" ]; then
            echo "ERROR: snd-hda-codec-realtek.ko not found"

            echo
            echo "Possible HDA modules:"
            find "$KERNEL_DIR" \
              -type f \
              -name '*.ko' \
              | grep -Ei 'hda|snd' \
              | sort || true

            exit 1
          fi

          echo
          echo "Found:"
          echo "$MODULE"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$MODULE" \
            "$GITHUB_WORKSPACE/output/snd-hda-codec-realtek.ko"

      # ============================================================
      # VERIFY CUSTOM MODULE
      # ============================================================

      - name: Verify custom module
        run: |
          MODULE="$GITHUB_WORKSPACE/output/snd-hda-codec-realtek.ko"

          echo "=========================================="
          echo "MODULE FILE"
          echo "=========================================="

          ls -lh "$MODULE"
          file "$MODULE"

          echo
          echo "=========================================="
          echo "CUSTOM STRINGS"
          echo "=========================================="

          strings "$MODULE" \
            | grep -E \
              '\[CUSTOM KMOD\]|BENQ T31 PRE_PROBE|BENQ T31 PROBE'

          echo
          echo "=========================================="
          echo "MODULE INFO"
          echo "=========================================="

          modinfo "$MODULE" || true

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload custom module
        uses: actions/upload-artifact@v4
        with:
          name: custom-snd-hda-codec-realtek-25.12.5
          path: output/snd-hda-codec-realtek.ko
          if-no-files-found: error
