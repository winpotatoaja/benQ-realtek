name: Full Build OpenWrt 25.12.5 (BenQ T31 Audio + Modem)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TOOLCHAIN_URL: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-toolchain-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
  LLVM_URL: "https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/llvm-bpf-21.1.6.Linux-x86_64.tar.zst"
  OWRT_ARCH: "x86/64"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v25.12.5

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd pkg-config m4 patch

      - name: Download & Inject External Toolchain
        run: |
          mkdir -p /opt/toolchain
          wget -q "$TOOLCHAIN_URL" -O toolchain.tar.zst
          tar --zstd -xf toolchain.tar.zst -C /opt/toolchain --strip-components=2 --wildcards "*/toolchain-x86_64_gcc-*"
          rm toolchain.tar.zst
          test -d /opt/toolchain/bin || { echo "❌ Error: Toolchain extraction failed!"; exit 1; }

          wget -q "$LLVM_URL" -O llvm.tar.zst
          mkdir -p staging_dir
          tar --zstd -xf llvm.tar.zst -C staging_dir/
          rm llvm.tar.zst

      - name: Inject Custom Scripts (Resize, Modem, Network)
        run: |
          mkdir -p files/etc/uci-defaults
          
          # [SCRIPT RESIZE PARTISI]
          cat << "EOF" > files/etc/uci-defaults/70-rootpt-resize
          if [ ! -e /etc/rootpt-resize ] && type parted > /dev/null && lock -n /var/lock/root-resize; then
            ROOT_BLK="$(readlink -f /sys/dev/block/"$(awk -e '$9=="/dev/root"{print $3}' /proc/self/mountinfo)")"
            ROOT_DISK="/dev/$(basename "${ROOT_BLK%/*}")"
            ROOT_PART="${ROOT_BLK##*[^0-9]}"
            parted -f -s "${ROOT_DISK}" resizepart "${ROOT_PART}" 100%
            mount_root done
            touch /etc/rootpt-resize
            if [ -e /boot/cmdline.txt ]; then 
              NEW_UUID=`blkid ${ROOT_DISK}p${ROOT_PART} | sed -n 's/.*PARTUUID="\([^"]*\)".*/\1/p'`
              sed -i "s/PARTUUID=[^ ]*/PARTUUID=${NEW_UUID}/" /boot/cmdline.txt
            fi
            reboot
          fi
          exit 1
          EOF
          
          # [SCRIPT RESIZE FILESYSTEM]
          cat << "EOF" > files/etc/uci-defaults/80-rootfs-resize
          if [ ! -e /etc/rootfs-resize ] && [ -e /etc/rootpt-resize ] && type losetup > /dev/null && type resize2fs > /dev/null && lock -n /var/lock/root-resize; then
            ROOT_BLK="$(readlink -f /sys/dev/block/"$(awk -e '$9=="/dev/root"{print $3}' /proc/self/mountinfo)")"
            ROOT_DEV="/dev/${ROOT_BLK##*/}"
            LOOP_DEV="$(awk -e '$5=="/overlay"{print $9}' /proc/self/mountinfo)"
            if [ -z "${LOOP_DEV}" ]; then
              LOOP_DEV="$(losetup -f)"
              losetup "${LOOP_DEV}" "${ROOT_DEV}"
            fi
            resize2fs -f "${LOOP_DEV}"
            mount_root done
            touch /etc/rootfs-resize
            reboot
          fi
          exit 1
          EOF
          
          cat << "EOF" >> files/etc/sysupgrade.conf
          /etc/uci-defaults/70-rootpt-resize
          /etc/uci-defaults/80-rootfs-resize
          EOF

          # [SCRIPT FIRST BOOT - Konfigurasi Jaringan]
          cat << "EOF" > files/etc/uci-defaults/99-custom-config
          # 1. Zona Waktu
          uci set system.@system[0].timezone='WIB-7'
          uci set system.@system[0].zonename='Asia/Jakarta'
          uci commit system
          
          # 2. Setup WAN & WAN6 untuk USB-to-LAN (eth1)
          uci set network.wan='interface'
          uci set network.wan.proto='dhcp'
          uci set network.wan.device='eth1'

          uci set network.wan6='interface'
          uci set network.wan6.proto='dhcpv6'
          uci set network.wan6.device='eth1'
          
          # 3. Setup ModemManager
          uci -q delete network.Dell_DW5821e
          uci set network.Dell_DW5821e='interface'
          uci set network.Dell_DW5821e.proto='modemmanager'
          uci set network.Dell_DW5821e.force_link='1'
          uci set network.Dell_DW5821e.apn='internet'
          uci add_list network.Dell_DW5821e.allowedauth='none'
          uci set network.Dell_DW5821e.iptype='ipv4'
          uci set network.Dell_DW5821e.loglevel='ERR'

          uci -q delete network.modem
          uci set network.modem='interface'
          uci set network.modem.proto='none'
          uci set network.modem.device='wwan0'
          uci set network.modem.force_link='1'
          
          # 4. Setup USB Tethering (HP)
          uci set network.usbwan="interface"
          uci set network.usbwan.ifname="usb0"
          uci set network.usbwan.proto="dhcp"
          uci commit network

          # 5. Setup Wireless (WiFi bawaan)
          uci set wireless.@wifi-device[0].disabled="0"
          uci set wireless.@wifi-device[0].channel="11"
          uci set wireless.@wifi-device[0].htmode="HT20"
          uci set wireless.@wifi-iface[0].disabled="0"
          uci set wireless.@wifi-iface[0].ssid="Linksys"
          uci set wireless.@wifi-iface[0].key="12345678"
          uci set wireless.@wifi-iface[0].encryption="none"
          uci commit wireless

          # 6. Firewall - HANYA menempelkan usbwan ke zona WAN, ModemManager ditangani manual di LuCI
          WAN_IDX=$(uci show firewall | grep -F ".name='wan'" | cut -d. -f2 | cut -d= -f1)
          uci add_list firewall.${WAN_IDX}.network="usbwan"
          # Catatan: interface 'wan' dan 'wan6' otomatis sudah tergabung ke zona firewall WAN oleh bawaan sistem
          uci commit firewall
          
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/*

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch Kernel Config Safely (Built-in AMD IXP)
        run: |
          for f in target/linux/x86/config-*; do
            [ -f "$f" ] || continue
            sed -i '/CONFIG_ATA=/d' "$f"
            sed -i '/CONFIG_ATA_SFF=/d' "$f"
            sed -i '/CONFIG_ATA_BMDMA=/d' "$f"
            sed -i '/CONFIG_PATA_ATIIXP/d' "$f"
            sed -i '/CONFIG_ATA_PIIX/d' "$f"
            sed -i '/CONFIG_SATA_SIL/d' "$f"

            cat >> "$f" <<EOF
          CONFIG_ATA=y
          CONFIG_ATA_SFF=y
          CONFIG_ATA_BMDMA=y
          CONFIG_PATA_ATIIXP=y
          CONFIG_ATA_PIIX=y
          CONFIG_SATA_SIL=y
          EOF
          done

      - name: Generate .config & Evaluate Toolchain
        run: |
          wget -q https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/config.buildinfo -O .config
          
          sed -i '/CONFIG_ALL_KMODS=y/d; /CONFIG_ALL_NONSHARED=y/d; /CONFIG_IB=y/d; /CONFIG_SDK=y/d; /CONFIG_SDK_LLVM_BPF=y/d; /CONFIG_MAKE_TOOLCHAIN=y/d; /CONFIG_BUILDBOT=y/d' .config
          
          echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          echo "CONFIG_ALL_KMODS=y" >> .config
          
          PACKAGES="kmod-ath9k kmod-tun kmod-r8169 kmod-sound-core kmod-sound-hda-core kmod-sound-hda-intel kmod-ac97 kmod-sound-i8x0 alsa-utils wpad-basic-wolfssl kmod-usb-net-rtl8152 kmod-rtl8192se kmod-usb-ohci kmod-usb-ehci-pci kmod-usb2 kmod-pci kmod-i2c-piix4 kmod-ohci-pci kmod-ehci-pci kmod-k8temp kmod-radeon kmod-drm-radeon kmod-yenta-cardbus kmod-pcmcia-yenta kmod-firewire-ohci kmod-firewire-core kmod-tifm-7xx1 kmod-tifm-core kmod-sdhci-pci kmod-sdhci modemmanager modemmanager-rpcd libmbim libqmi luci-proto-modemmanager kmod-usb-serial-option kmod-usb-net-cdc-mbim umbim kmod-usb-acm kmod-usb-wdm kmod-usb-net-rndis parted losetup resize2fs blkid"
          
          for pkg in $PACKAGES; do
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          done
          
          ./scripts/ext-toolchain.sh --toolchain /opt/toolchain --overwrite-config --config $OWRT_ARCH
          make defconfig

      - name: Prepare Host Tools & Kernel Source
        run: |
          make tools/install V=s
          make target/linux/prepare V=s

      - name: Locate Kernel Source & Inject ALC262 Debug
        run: |
          KERNEL_DIR="$(find build_dir -type d -path '*/linux-x86_64/linux-6.12.94' -print -quit)"
          if [ -z "$KERNEL_DIR" ]; then echo "ERROR: kernel dir not found"; exit 1; fi
          
          FILE="$KERNEL_DIR/sound/pci/hda/patch_realtek.c"
          test -f "$FILE"
          
          echo "Injecting ALC262 Custom KMOD to $FILE..."
          
          python3 - "$FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              source = f.read()

          if "alc262_fixup_benq_t31_debug" in source:
              sys.exit(0)

          marker = "static const struct hda_fixup alc262_fixups[] = {"
          code = r'''static void alc262_fixup_benq_t31_debug(struct hda_codec *codec,
                                                            const struct hda_fixup *fix,
                                                            int action)
          {
              if (action == HDA_FIXUP_ACT_PRE_PROBE) {
                  codec_info(codec, "ALC262: [CUSTOM KMOD] BENQ T31 PRE_PROBE\n");
                  snd_hda_codec_write(codec, 0x20, 0, AC_VERB_SET_COEF_INDEX, 0x07);
                  snd_hda_codec_write(codec, 0x20, 0, AC_VERB_SET_PROC_COEF, 0x3050);
              }
              if (action == HDA_FIXUP_ACT_PROBE) {
                  codec_info(codec, "ALC262: [CUSTOM KMOD] BENQ T31 PROBE\n");
              }
          }
          '''
          source = source.replace(marker, code + marker, 1)

          pattern = re.compile(r'(\[ALC262_FIXUP_BENQ_T31\]\s*=\s*\{).*?(\n\s*\},)', re.DOTALL)
          match = pattern.search(source)
          
          if match:
              replacement = match.group(1) + r'''
                  .type = HDA_FIXUP_FUNC,
                  .v.func = alc262_fixup_benq_t31_debug,
              ''' + match.group(2)
              source = source[:match.start()] + replacement + source[match.end():]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(source)
              print("✅ Injection successful!")
          else:
              print("❌ ERROR: ALC262 block not found!")
              sys.exit(1)
          PY

      - name: Download Packages
        run: |
          make download -j8

      - name: Compile Full Firmware (With Custom ALC262)
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Pack All Kmod Packages
        continue-on-error: true
        run: |
          find bin/ -type f -name "kmod-*.apk" | zip -j@ $GITHUB_WORKSPACE/kmod-backup-all.zip || true

      - name: Extract Custom ALC262 KO File
        continue-on-error: true
        run: |
          KERNEL_DIR="$(find build_dir -type d -path '*/linux-x86_64/linux-6.12.94' -print -quit)"
          MODULE="$(find "$KERNEL_DIR" -type f -name 'snd-hda-codec-realtek.ko' -print -quit)"
          if [ -n "$MODULE" ]; then
             mkdir -p $GITHUB_WORKSPACE/debug-artifacts
             cp "$MODULE" $GITHUB_WORKSPACE/debug-artifacts/
             strings "$MODULE" | grep -E 'CUSTOM KMOD|BENQ T31' > $GITHUB_WORKSPACE/debug-artifacts/verify.txt
          fi

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=v25.12.5-x86-BenQ-T31-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "release_name=OpenWrt 25.12.5 x86_64 (Native Audio + Modem) $(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_name }}
          fail_on_unmatched_files: false
          files: |
            bin/targets/x86/64/*squashfs-combined.img.gz
            bin/targets/x86/64/*squashfs-combined-efi.img.gz
            bin/targets/x86/64/*ext4-combined.img.gz
            bin/targets/x86/64/*ext4-combined-efi.img.gz
            bin/targets/x86/64/sha256sums
            kmod-backup-all.zip
            debug-artifacts/*
